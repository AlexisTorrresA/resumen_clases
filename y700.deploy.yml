version: 1
name: resumen-clases
image: ghcr.io/alexistorrresa/resumen-clases:main
container_name: y700-resumen-clases
container_port: 8000
command:
  - uvicorn
  - app.main:app
  - --host
  - "0.0.0.0"
  - --port
  - "8000"
public:
  enabled: true
  subdomain: resumen-clases
healthcheck:
  path: /health
database:
  postgres: true
  name: resumen_clases
secrets:
  required: []
  optional:
    - OPENAI_API_KEY
    - OPENAI_MODEL
resources:
  memory: 512m
  cpus: 0.75
